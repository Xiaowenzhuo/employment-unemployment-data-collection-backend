spring.application.name=backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/employment_demo?serverTimezone=UTC}
spring.datasource.username=${DB_USER:app_user}
spring.datasource.password=${DB_PASSWORD:}
app.auth.secret=${APP_AUTH_SECRET}
app.build-version=0.0.1-SNAPSHOT
app.monitor.receiver-health-url=${NATIONAL_RECEIVER_HEALTH_URL:http://127.0.0.1:18080/api/v1/health}
spring.rabbitmq.connection-timeout=2000
app.national.role=${APP_NATIONAL_ROLE:sender}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}
spring.rabbitmq.ssl.trust-store=${RABBITMQ_TRUST_STORE:}
spring.rabbitmq.ssl.trust-store-password=${RABBITMQ_TRUST_STORE_PASSWORD:}
spring.rabbitmq.ssl.trust-store-type=PKCS12
spring.rabbitmq.ssl.verify-hostname=true
